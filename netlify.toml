# ============================================================
#  Netlify 배포 설정
#
#  ★ publish = "public" 이 가장 중요하다.
#    저장소 전체를 공개하면 generate_bank.js 같은 파일까지
#    주소만 치면 내려받을 수 있게 된다. 그 안에는 Gemini 키가 들어 있다.
#    그래서 웹에 올릴 파일만 public/ 에 모으고, 그 폴더만 공개한다.
#
#  폴더 구조
#    프로젝트/
#      public/                ← 이 폴더만 인터넷에 올라간다
#        index.html
#        script.js
#        style.css
#        auth.js
#      netlify/functions/
#        gemini.js            ← AI 키를 숨기는 프록시
#      generate_bank.js       ← 올라가지 않는다 (키 들어 있음)
#      upload_bank.js         ← 올라가지 않는다
#      serviceAccountKey.json ← 올라가지 않는다 (.gitignore)
#      netlify.toml
#      .gitignore
# ============================================================

[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[build.environment]
  NODE_VERSION = "20"

  # ★ 환경변수를 여기 적지 말 것 — 함수에 전달되지 않는다.
  #   Netlify 공식 문서: "netlify.toml 에 선언한 환경변수는 서버리스 함수에서 사용할 수 없습니다."
  #   GEMINI_API_KEY 와 FIREBASE_WEB_API_KEY 는 반드시
  #   Netlify 대시보드 → Environment variables 에 등록해야 한다.
  #   (netlify dev 는 이 파일을 읽어주기 때문에 로컬에서만 되고 배포본에서 안 되는
  #    현상이 생긴다. 실제로 그 함정에 한 번 빠졌다.)

  # FIREBASE_WEB_API_KEY 는 원래 공개되는 값이라 public/auth.js 안에도 들어 있다.
  # 그대로 두면 Netlify 의 비밀값 검사가 "키가 빌드 결과물에 노출됐다"며 배포를 실패시킨다.
  # 그래서 이 키만 검사에서 제외한다. GEMINI_API_KEY 는 계속 검사되므로,
  # 실수로 코드에 넣으면 배포가 막혀 준다.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_WEB_API_KEY"

[functions]
  node_bundler = "esbuild"

# 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 소스 파일은 캐시하지 않는다 (고치면 바로 반영되도록)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"